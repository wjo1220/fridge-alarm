<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>우리집 냉장고 유통기한 알리미</title>
<meta name="description" content="냉장고에 넣은 음식과 유통기한을 기록하면 임박한 음식을 알려주는 무료 앱">
<meta name="theme-color" content="#5aa9f5">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="냉장고">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef6fb;--card:#ffffff;--ink:#22323f;--sub:#7b8b98;--line:#e6eef4;
    --mint:#3cc5a2;--mint-soft:#e3f8f2;--sky:#5aa9f5;--sky-soft:#e6f2fe;
    --orange:#ff9f43;--orange-soft:#fff2e3;--red:#ff6b6b;--red-soft:#ffe9e9;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:"Gowun Dodum",-apple-system,"Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:540px;margin:0 auto;padding:0 0 110px}

  /* 헤더 */
  .hero{background:linear-gradient(140deg,#7fd3f7 0%,#5aa9f5 55%,#7b8cf5 100%);color:#fff;padding:22px 20px 60px;display:flex;align-items:center;justify-content:space-between;border-radius:0 0 32px 32px;position:relative;overflow:hidden}
  .hero::after{content:"❄";position:absolute;right:-10px;top:-24px;font-size:150px;opacity:.13}
  .hero h1{font-family:"Jua",sans-serif;font-weight:400;font-size:27px;margin:0 0 4px;letter-spacing:-.5px}
  .bell{position:relative;z-index:1;font-family:"Jua";font-size:14.5px;border:1.5px solid rgba(255,255,255,.7);border-radius:99px;padding:8px 13px;background:rgba(255,255,255,.22);color:#fff;cursor:pointer;white-space:nowrap}
  .bell.off{background:#fff;color:#2b7fd4;border-color:#fff;box-shadow:0 4px 12px rgba(30,80,150,.25)}
  .bell:active{transform:scale(.95)}
  .stats{display:flex;gap:10px;margin:-44px 16px 16px;position:relative;z-index:1}
  .stat{flex:1;background:#fff;border-radius:18px;padding:12px 8px;text-align:center;box-shadow:0 6px 18px rgba(60,110,160,.12)}
  .stat b{display:block;font-family:"Jua";font-weight:400;font-size:26px;line-height:1.1}
  .stat span{font-size:12px;color:var(--sub)}
  .stat.all b{color:var(--sky)} .stat.soon b{color:var(--orange)} .stat.bad b{color:var(--red)}

  .alert{margin:0 16px 14px;border-radius:18px;padding:14px 16px;font-size:14.5px;line-height:1.6;display:none}
  .alert.warn{display:block;background:var(--orange-soft);border:1.5px solid #ffd3a3}
  .alert.ok{display:block;background:var(--mint-soft);border:1.5px solid #b5ecdc}

  .card{background:var(--card);border-radius:24px;padding:18px;margin:0 16px 14px;box-shadow:0 4px 16px rgba(60,110,160,.08)}
  .card h2{font-family:"Jua";font-weight:400;font-size:18px;margin:0 0 14px}

  /* 입력 */
  .namebox{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .preview{width:58px;height:58px;flex:none;border-radius:18px;background:var(--sky-soft);display:flex;align-items:center;justify-content:center;font-size:32px;transition:transform .25s}
  .preview.pop{transform:scale(1.18) rotate(-6deg)}
  .sv{width:1.45em;height:1.45em;display:block;margin:0 auto}
  input,select{width:100%;font-family:inherit;font-size:16px;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:#f8fbfd;color:var(--ink);outline:none;transition:border .2s}
  input:focus,select:focus{border-color:var(--sky);background:#fff}
  .places{display:flex;gap:8px;margin-bottom:12px}
  .places button{flex:1;font-family:inherit;font-size:15px;padding:11px 0;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
  .places button.on{border-color:var(--sky);background:var(--sky-soft);color:#2b7fd4;font-weight:700}
  .quick{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
  .quick button{font-family:inherit;padding:7px 12px;font-size:13px;border:0;border-radius:99px;background:#f0f5f9;color:var(--ink);cursor:pointer}
  .quick button:active{background:var(--sky-soft)}
  .quick button.on{background:var(--sky);color:#fff}
  .freq{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;margin-bottom:10px;scrollbar-width:none}
  .freq::-webkit-scrollbar{display:none}
  .freq button{flex:none;display:inline-flex;align-items:center;gap:4px;font-family:inherit;font-size:14px;padding:7px 12px 7px 9px;border:1.5px solid #ffd9a8;border-radius:99px;background:#fff8ee;color:var(--ink);cursor:pointer}
  .freq button:active{background:#ffe9cc}
  .freq .fi{font-size:17px;line-height:1;display:inline-flex}
  .freq .fi .sv{width:18px;height:18px}
  input:disabled{opacity:.4}
  .item.nodate .badge{background:#eef3f7;color:var(--sub)}
  .lblrow{display:flex;align-items:center;justify-content:space-between;margin:8px 0 4px}
  .lblrow label{margin:0!important}
  .nd{font-family:inherit;font-size:12.5px;border:1.5px solid var(--line);background:#fff;color:var(--sub);border-radius:99px;padding:4px 10px;cursor:pointer}
  .nd.on{background:var(--sky);border-color:var(--sky);color:#fff}
  .kinds{margin-bottom:8px}.kinds button{padding:9px 0;font-size:14.5px}
  .kmark{font-size:11px;padding:1px 6px;border-radius:99px;background:#eef3f7;color:var(--sub);margin-left:4px}
  .dwrap{position:relative}.dwrap input{display:block;margin:0}
  .dph{position:absolute;left:14px;right:14px;top:50%;transform:translateY(-50%);color:#8a9aa8;font-size:15.5px;pointer-events:none;white-space:nowrap;overflow:hidden;text-align:left;line-height:1.2}
  .dwrap.noval input{color:transparent}
  .dwrap:not(.noval) .dph{display:none}
  .primary{width:100%;font-family:"Jua";font-size:18px;border:0;border-radius:16px;padding:14px;cursor:pointer;color:#fff;background:linear-gradient(135deg,#3cc5a2,#2fb6c9);box-shadow:0 6px 14px rgba(47,182,170,.3)}
  .primary:active{transform:translateY(1px)}

  /* 목록 */
  .ptabs{display:flex;gap:6px;background:#f0f5f9;padding:5px;border-radius:16px;margin-bottom:12px}
  .ptabs button{flex:1;font-family:"Jua";font-size:16px;padding:11px 0;border:0;border-radius:12px;background:transparent;color:var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
  .ptabs button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(60,110,160,.12)}
  .ptabs i{font-style:normal;font-size:12px;min-width:20px;padding:1px 6px;border-radius:99px;background:#e3ebf2;color:var(--sub)}
  .ptabs button.on i{background:var(--sky-soft);color:#2b7fd4}
  .ptabs i.warn{background:var(--orange)!important;color:#fff!important}
  .phead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:-2px 0 8px;min-height:4px}
  .selbtn{font-family:"Jua";font-size:13.5px;border:1.5px solid var(--line);background:#fff;color:var(--sub);border-radius:99px;padding:6px 12px;cursor:pointer}
  .qty{font-family:"Jua";font-size:13px;color:#2b7fd4;background:var(--sky-soft);border-radius:99px;padding:1px 7px;margin-left:5px;vertical-align:2px}
  .qrow{display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px}
  .qrow .lbl{margin:0}
  .stepper{display:flex;align-items:center;gap:4px;background:#f0f5f9;border-radius:14px;padding:4px}
  .stepper button{width:38px;height:38px;border:0;border-radius:11px;background:#fff;font-size:20px;font-family:"Jua";color:var(--ink);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .stepper b{min-width:34px;text-align:center;font-family:"Jua";font-weight:400;font-size:19px}
  .pick{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid #c5d3de;background:#fff;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
  .item.picked{border-color:#ff8a8a;background:#fff5f5}
  .item.picked .pick{background:#ff6b6b;border-color:#ff6b6b}.item.picked .pick::after{content:"✓"}
  .selbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:none;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#fff;box-shadow:0 -6px 20px rgba(30,60,90,.12)}
  .selbar.show{display:flex}
  .selbar button{flex:1;font-family:"Jua";font-size:17px;padding:14px;border:0;border-radius:16px;cursor:pointer}
  #selCancel{flex:.5;background:#eef3f7;color:var(--ink)}
  #selDel{background:#ff6b6b;color:#fff}#selDel:disabled{opacity:.45}
  .tempbtn{font-family:"Jua";font-size:14px;border:0;border-radius:99px;padding:6px 12px;background:#24313d;color:#8dffcf;cursor:pointer}
  .tempbtn.fz{color:#7fe3ff}.tempbtn.hot{color:#ffb199}
  .tempbtn span{color:#9fb6c8;font-size:12px;margin-left:4px}
  .item{cursor:pointer}
  .item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;margin-bottom:8px;background:#fafcfe;border:1.5px solid var(--line);animation:in .3s ease}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
  .item.warn{background:#fffaf4;border-color:#ffe0bd}
  .item.bad{background:#fff6f6;border-color:#ffd0d0}
  .ico{width:50px;height:50px;flex:none;border-radius:16px;background:var(--sky-soft);display:flex;align-items:center;justify-content:center;font-size:27px}
  .item.warn .ico{background:var(--orange-soft)} .item.bad .ico{background:var(--red-soft)}
  .info{flex:1;min-width:0}
  .name{font-size:16.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta{font-size:12px;color:var(--sub);margin-top:2px}
  .bar{height:6px;background:#e9f0f5;border-radius:9px;margin-top:7px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:9px;background:var(--mint)}
  .item.warn .bar i{background:var(--orange)} .item.bad .bar i{background:var(--red)}
  .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;position:relative}
  .tip{position:absolute;top:calc(100% + 9px);right:0;z-index:3;white-space:nowrap;font-family:"Jua";font-size:13px;color:#fff;background:#22323f;padding:7px 11px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.2);animation:bob 1.6s infinite}
  .tip::before{content:"";position:absolute;top:-6px;right:22px;border:6px solid transparent;border-top:0;border-bottom-color:#22323f}
  @keyframes bob{50%{transform:translateY(3px)}}
  .badge{font-family:"Jua";font-size:15px;padding:4px 10px;border-radius:99px;background:var(--mint-soft);color:#1f9e7f;white-space:nowrap}
  .item.warn .badge{background:var(--orange-soft);color:#e07f17}
  .item.bad .badge{background:var(--red-soft);color:#e04848}
  .del{display:flex;align-items:center;gap:5px;font-family:"Jua";font-size:13.5px;color:#1f9e7f;background:#fff;border:1.5px solid #a8e3d2;border-radius:12px;padding:5px 10px 5px 7px;cursor:pointer;box-shadow:0 2px 0 #cdeee4;transition:transform .1s}
  .del:active{transform:translateY(2px);box-shadow:none}
  .ck{width:17px;height:17px;border-radius:50%;border:2px solid #3cc5a2;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;transition:background .2s}
  .del.done .ck{background:#3cc5a2}.del.done .ck::after{content:"✓"}
  .item.out{opacity:0;transform:translateX(40px);transition:.3s}
  .empty{color:var(--sub);text-align:center;padding:28px 0 18px;font-size:14px}
  .empty div{font-size:46px;margin-bottom:6px}

  .set{display:flex;align-items:center;gap:8px;font-size:14px;flex-wrap:wrap}
  .set select{width:auto;padding:8px 12px}
  .foot{font-size:12px;color:var(--sub);text-align:center;margin-top:6px}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(80px);background:#22323f;color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;transition:transform .3s;z-index:9}
  .toast{pointer-events:none;transform:translateX(-50%) translateY(200px)!important}
  .toast.show{pointer-events:auto;transform:translateX(-50%) translateY(0)!important}

  .temp{display:flex;align-items:center;justify-content:center;gap:16px;margin:6px 0 4px}
  .temp button{width:52px;height:52px;border-radius:50%;border:0;font-size:26px;font-family:"Jua";background:#eef3f7;color:var(--ink);cursor:pointer}
  .temp .val{min-width:110px;padding:10px 0;border-radius:16px;background:linear-gradient(180deg,#24313d,#16202a);font-family:"Jua";font-size:38px;color:#7fe3ff;text-shadow:0 0 10px rgba(127,227,255,.7)}
  .temp .val.cold{color:#8dffcf;text-shadow:0 0 10px rgba(141,255,207,.6)}
  .tnote{font-size:12.5px;color:var(--sub);min-height:36px;margin:8px 0 14px;line-height:1.45}
  .tnote.bad{color:#e0622f}
  .edit{text-align:left;margin:0 0 14px}
  .edit label{display:block;font-size:12px;color:var(--sub);margin:8px 0 4px}
  .edit input{padding:10px 12px;font-size:15px}
  .edit .places{margin:0}
  .edit .places button{padding:9px 0;font-size:14px}
  .x{position:absolute;right:14px;top:12px;border:0;background:#eef3f7;width:32px;height:32px;border-radius:50%;font-size:15px;cursor:pointer;color:var(--sub)}
  .sheet{position:relative}
  .sheet .save{background:var(--sky);color:#fff}
  .toast button{margin-left:10px;border:0;background:#fff;color:var(--ink);font-family:"Jua";border-radius:99px;padding:4px 10px;cursor:pointer}
  .ex{font-size:12px;color:var(--sub);margin:-6px 0 10px}
  /* 팝업 */
  .modal{position:fixed;inset:0;background:rgba(30,45,60,.35);display:none;align-items:center;justify-content:center;z-index:8;padding:20px}
  .modal.show{display:flex}
  .sheet{background:#fff;border-radius:26px;padding:22px;width:100%;max-width:300px;text-align:center;animation:in .25s}
  .sheet .big{font-size:56px}
  .sheet h3{font-family:"Jua";font-weight:400;font-size:22px;margin:4px 0}
  .sheet p{color:var(--sub);font-size:14px;margin:0 0 16px}
  .sheet .btns{display:flex;gap:8px}
  .sheet .btns button{flex:1;font-family:"Jua";font-size:16px;padding:12px;border:0;border-radius:14px;cursor:pointer}
  .sheet .eat{background:var(--mint);color:#fff}.sheet .close{background:#eef3f7;color:var(--ink)}
  /* 아래에서 올라오는 창 */
  .modal.bottom{align-items:flex-end;padding:0;bottom:auto;height:var(--vvh,100dvh)}
  .sheet.wide{max-width:540px;border-radius:26px 26px 0 0;text-align:left;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:up .28s ease;max-height:calc(var(--vvh,100dvh) - 12px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .err{display:none;color:#e5484d;font-size:13px;font-weight:700;margin:6px 2px 0}.err.show{display:block}
  #date.bad{border-color:#e5484d!important;box-shadow:0 0 0 3px rgba(229,72,77,.15)}
  .sheet.wide h3{margin:0 0 16px}
  .lbl{display:block;font-size:13px;color:var(--sub);margin:0 0 6px}
  .fab{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;font-family:"Jua";font-size:20px;color:#fff;border:3px solid #fff;border-radius:99px;padding:15px 34px;cursor:pointer;
       background:linear-gradient(135deg,#ffb347,#ff6b6b);box-shadow:0 10px 24px rgba(255,107,107,.5);text-shadow:0 1px 2px rgba(180,60,40,.35)}
  .fab.pulse{animation:pulse 1.8s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 10px 24px rgba(255,107,107,.5),0 0 0 0 rgba(255,107,107,.55)}60%{box-shadow:0 10px 24px rgba(255,107,107,.5),0 0 0 16px rgba(255,107,107,0)}}
  .fab:active{transform:translateX(-50%) scale(.96)}
  .srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;border-top:1px solid var(--line);font-size:15px}
  .srow select{width:auto;padding:8px 12px}
  .srow.col{flex-direction:column;align-items:stretch}
  .srow.col .pnote{margin:0}
  /* 알림 */
  .push h2{margin-bottom:6px}
  .pnote{font-size:13.5px;color:var(--sub);margin:0 0 12px;line-height:1.5}
  .pbtns{display:flex;gap:8px}
  .ghost{flex:1;font-family:"Jua";font-size:15px;padding:12px 6px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);cursor:pointer}
  .ghost:active{background:var(--sky-soft)}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>🧊 우리집 냉장고</h1>
    <button class="bell off" id="bell">🔔 알림 켜기</button>
  </div>

  <div class="stats">
    <div class="stat all"><b id="sAll">0</b><span>보관 중</span></div>
    <div class="stat soon"><b id="sSoon">0</b><span>임박</span></div>
    <div class="stat bad"><b id="sBad">0</b><span>지남</span></div>
  </div>

  <div id="alert" class="alert"></div>

  <div class="card main">
    <div class="ptabs" id="ptabs">
      <button data-f="냉장" class="on">🧊 냉장<i id="c냉장">0</i></button>
      <button data-f="냉동">❄️ 냉동<i id="c냉동">0</i></button>
      <button data-f="실온">🏠 실온<i id="c실온">0</i></button>
    </div>
    <div class="phead" id="phead"></div>
    <div id="list"></div>
  </div>
</div>
<button class="fab" id="fab">＋ 음식 넣기</button>
<div class="selbar" id="selbar"><button id="selCancel">취소</button><button id="selDel" disabled>지우기</button></div>
<div class="modal bottom" id="addModal"><div class="sheet wide">
  <button class="x" id="aClose">✕</button>
  <h3>음식 넣기</h3>
  <form id="form">
      <div id="freqWrap" style="display:none"><div class="lbl">⭐ 자주 넣는 음식</div><div class="freq" id="freq"></div></div>
      <div class="namebox">
        <div class="preview" id="preview">🍽️</div>
        <input id="name" placeholder="무엇을 넣을까요? (예: 우유)" required autocomplete="off">
      </div>
      <div class="places" id="places">
        <button type="button" data-p="냉장" class="on">🧊 냉장</button>
        <button type="button" data-p="냉동">❄️ 냉동</button>
        <button type="button" data-p="실온">🏠 실온</button>
      </div>
      <div class="places kinds" id="kinds">
        <button type="button" data-k="소비" class="on">소비기한</button>
        <button type="button" data-k="유통">유통기한</button>
      </div>
      <div class="dwrap noval" id="dwrap"><input id="date" type="date"><span class="dph" id="dph">📅 여기를 눌러 날짜를 골라요</span></div>
      <p class="err" id="dateErr">날짜를 골라 주세요. 없으면 "기한 없음"을 눌러요.</p>
      <div class="quick">
        <button type="button" data-d="3">3일</button>
        <button type="button" data-d="7">1주</button>
        <button type="button" data-d="14">2주</button>
        <button type="button" data-d="30">1달</button>
        <button type="button" data-d="90">3달</button>
        <button type="button" data-d="none" id="noDate">기한 없음</button>
      </div>
      <div class="qrow"><span class="lbl">수량</span>
        <div class="stepper" id="qStep"><button type="button" data-q="-1">−</button><b id="qty">1</b><button type="button" data-q="1">+</button></div>
      </div>
      <button class="primary" type="submit">냉장고에 넣기</button>
    </form>
</div></div>
<div class="modal bottom" id="sModal"><div class="sheet wide">
  <button class="x" id="sClose">✕</button>
  <h3>🔔 알림</h3>
  <div class="srow"><span>며칠 전부터 알려줄까요?</span>
    <select id="days">
      <option value="1">1일 전</option><option value="2">2일 전</option>
      <option value="3" selected>3일 전</option><option value="5">5일 전</option><option value="7">7일 전</option>
    </select>
  </div>

<script>
// 음식 이름 → 아이콘
const ICONS = [
  [["우유","밀크"],"🥛"],[["요거트","요구르트","요플레"],"🥣"],[["계란","달걀","메추리알"],"🥚"],
  [["치즈"],"🧀"],[["버터"],"🧈"],[["생크림","아이스크림","빙수"],"🍦"],
  [["삼겹","목살","소고기","돼지","쇠고기","한우","고기","스테이크","갈비","불고기","차돌","등심"],"🥩"],
  [["닭","치킨"],"🍗"],[["베이컨"],"🥓"],[["소시지","햄","핫도그"],"🌭"],
  [["새우"],"🦐"],[["오징어","문어","쭈꾸미","낙지"],"🦑"],[["게","꽃게","대게"],"🦀"],[["조개","굴","전복"],"🦪"],
  [["생선","고등어","연어","갈치","참치","명태","동태","조기","회"],"🐟"],
  [["사과"],"🍎"],[["배"],"🍐"],[["바나나"],"🍌"],[["딸기"],"🍓"],[["포도","샤인머스캣"],"🍇"],
  [["귤","오렌지","한라봉","천혜향"],"🍊"],[["레몬","라임"],"🍋"],[["수박"],"🍉"],[["복숭아"],"🍑"],
  [["체리"],"🍒"],[["키위"],"🥝"],[["망고"],"🥭"],[["파인애플"],"🍍"],[["블루베리"],"🫐"],[["멜론","참외"],"🍈"],
  [["토마토"],"🍅"],[["당근"],"🥕"],[["고구마"],"🍠"],[["감자"],"🥔"],[["양파"],"🧅"],[["마늘"],"🧄"],
  [["브로콜리"],"🥦"],[["오이"],"🥒"],[["가지"],"🍆"],[["옥수수"],"🌽"],[["고추","청양"],"🌶️"],[["파프리카","피망"],"🫑"],
  [["버섯","표고","팽이","새송이"],"🍄"],[["아보카도"],"🥑"],[["콩","낫또"],"🫘"],[["두부"],"TOFU"],
  [["상추","양상추","배추","양배추","시금치","깻잎","채소","야채","샐러드","김치","부추","대파","쪽파"],"🥬"],
  [["빵","식빵","베이글","바게트"],"🍞"],[["케이크","케익"],"🍰"],[["떡"],"🍡"],[["밥","햇반"],"🍚"],
  [["만두"],"🥟"],[["피자"],"🍕"],[["햄버거","버거"],"🍔"],[["라면","국수","면","우동","파스타"],"🍜"],
  [["국","찌개","탕","카레","수프"],"🍲"],[["반찬","도시락"],"🍱"],[["초콜릿","초코"],"🍫"],[["과자","쿠키"],"🍪"],
  [["꿀","잼"],"🍯"],[["케첩","마요","소스","장","된장","고추장","간장"],"🥫"],
  [["주스","쥬스"],"🧃"],[["콜라","사이다","탄산","음료"],"🥤"],[["맥주"],"🍺"],[["와인"],"🍷"],[["소주","막걸리","술"],"🍶"],
  [["커피","라떼"],"☕"],[["물","생수"],"💧"]
];
const TOFU_SVG=`<svg class="sv" viewBox="0 0 64 64" aria-label="두부"><ellipse cx="32" cy="55" rx="24" ry="4" fill="rgba(0,0,0,.08)"/><path d="M5 25 Q5 22 8 21 L28 13 Q31 12 34 13 L57 20 Q60 21 59 24 L38 33 Q34 35 30 33 Z" fill="#ffffff" stroke="#d8d2c0" stroke-width="1.5" stroke-linejoin="round"/><path d="M5 25 L30 33 Q34 35 34 38 L34 53 Q34 55 31 54 L8 46 Q5 45 5 42 Z" fill="#f7f4ec" stroke="#d8d2c0" stroke-width="1.5" stroke-linejoin="round"/><path d="M34 38 Q34 35 38 33 L59 24 L59 40 Q59 43 56 44 L37 53 Q34 55 34 53 Z" fill="#ebe5d4" stroke="#d8d2c0" stroke-width="1.5" stroke-linejoin="round"/><ellipse cx="25" cy="21" rx="6" ry="2" fill="#f1eee5" opacity=".9"/></svg>`;
function icoHTML(ico){return ico==="TOFU"?TOFU_SVG:ico;}
function icoText(ico){return ico==="TOFU"?"🤍":ico;}
function iconFor(name){
  const n=(name||"").replace(/\s/g,"");
  if(!n) return "🍽️";
  let best=null,len=0;
  for(const [keys,ico] of ICONS) for(const k of keys) if(n.includes(k)&&k.length>len){best=ico;len=k.length;}
  return best||"🍽️";
}

let items=[],filter="냉장",warnDays=3,place="냉장",addQty=1,mQty=1,selMode=false,picked=new Set();
const qtyOf=i=>Math.max(1,+i.qty||1);
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const kindOf=i=>(i&&i.kind==="소비")?"소비기한":"유통기한";
let kind="소비";try{kind=localStorage.getItem("fridge-kind")==="유통"?"유통":"소비";}catch(e){}
function markKinds(sel,k){document.querySelectorAll(sel+" button").forEach(b=>b.classList.toggle("on",b.dataset.k===k));}
const hasDate=i=>/^\d{4}-\d{2}-\d{2}$/.test((i&&i.date)||"");
function sinceText(i){if(!i.added)return"기한 없음";const n=-daysLeft(i.added);return n<=0?"오늘 넣음":"넣은 지 "+n+"일";}
function byDate(a,b){const x=hasDate(a),y=hasDate(b);if(x&&y)return a.date.localeCompare(b.date);if(x)return -1;if(y)return 1;return (a.added||"").localeCompare(b.added||"");}
function daysLeft(s){const t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(s+"T00:00:00")-t)/86400000);}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function toast(m,undo){const t=$("toast");t.textContent=m;
  if(undo){const b=document.createElement("button");b.textContent="되돌리기";b.onclick=()=>{undo();t.classList.remove("show");};t.appendChild(b);}
  t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),undo?4000:1800);}

let temps={fz:-18,fr:3};
function loadLocal(){try{const tp=JSON.parse(localStorage.getItem("fridge-temp")||"null");if(tp)temps=tp;}catch(e){}try{items=JSON.parse(localStorage.getItem("fridge-items")||"[]");warnDays=+(localStorage.getItem("fridge-days")||3);}catch(e){}}
function saveLocal(){try{localStorage.setItem("fridge-items",JSON.stringify(items));localStorage.setItem("fridge-days",warnDays);localStorage.setItem("fridge-temp",JSON.stringify(temps));}catch(e){}if(typeof syncPush==="function")syncPush();}

function render(){
  $("days").value=String(warnDays);
  for(const pl of ["냉장","냉동","실온"]){const l=items.filter(i=>i.place===pl),c=$("c"+pl);c.textContent=l.length;c.classList.toggle("warn",l.some(i=>hasDate(i)&&daysLeft(i.date)<=warnDays));}
  const tk=filter==="냉동"?"fz":filter==="냉장"?"fr":"";
  const cnt=items.filter(i=>i.place===filter).length;
  const left=selMode?`<button class="selbtn" id="selAll">${picked.size===cnt?"선택 해제":"전체 선택"}</button>`:cnt>=2?`<button class="selbtn" id="selOn">☑ 여러 개 지우기</button>`:"<span></span>";
  $("phead").innerHTML=left+(tk&&!selMode?`<button class="tempbtn ${tk}${(tk==="fz"?temps.fz>-15:temps.fr>5)?" hot":""}" data-temp="${tk}">🌡️ ${temps[tk]}°<span>온도 설정</span></button>`:"");
  $("selbar").classList.toggle("show",selMode);$("fab").style.display=selMode?"none":"";
  $("selDel").disabled=!picked.size;$("selDel").textContent=picked.size?`선택한 ${picked.size}개 지우기`:"지울 음식을 골라 주세요";
  const fb=document.getElementById("fab");if(fb)fb.classList.toggle("pulse",!items.length);
  const list=items.filter(i=>i.place===filter).sort(byDate);
  let tipShown=false;try{tipShown=localStorage.getItem("fridge-tip")==="1";}catch(e){}
  $("list").innerHTML=list.length?list.map(i=>{
    const dated=hasDate(i),d=dated?daysLeft(i.date):NaN;
    const cls=!dated?"nodate":d<0?"bad":d<=warnDays?"warn":"";
    const txt=!dated?sinceText(i):d<0?(-d)+"일 지남":d===0?"오늘까지":"D-"+d;
    const meta=dated?i.date.replace(/-/g,".")+"까지 · "+kindOf(i):"기한 없음";
    // 남은 기간 막대: 넣은 날~기한 기준
    let pct=100;
    if(dated&&i.added){const total=Math.max(1,Math.round((new Date(i.date)-new Date(i.added))/86400000));pct=Math.max(0,Math.min(100,d/total*100));}
    if(d<0)pct=100;
    const pIco=i.place==="냉동"?"❄️":i.place==="실온"?"🏠":"🧊";
    const q=qtyOf(i);
    if(selMode)return `<div class="item ${cls}${picked.has(i.id)?" picked":""}" data-pick="${i.id}"><div class="pick"></div><div class="ico">${icoHTML(iconFor(i.name))}</div>
      <div class="info"><div class="name">${esc(i.name)}${q>1?`<span class="qty">×${q}</span>`:""}</div><div class="meta">${meta}</div></div><div class="right"><div class="badge">${txt}</div></div></div>`;
    return `<div class="item ${cls}" data-open="${i.id}"><div class="ico">${icoHTML(iconFor(i.name))}</div>
      <div class="info"><div class="name">${esc(i.name)}${q>1?`<span class="qty">×${q}</span>`:""}</div>
        <div class="meta">${meta}</div>
        ${dated?`<div class="bar"><i style="width:${pct}%"></i></div>`:""}</div>
      <div class="right"><div class="badge">${txt}</div><button class="del" data-id="${i.id}"><span class="ck"></span>${q>1?"1개 먹음":"다 먹음"}</button>${!tipShown&&i===list[0]?`<div class="tip">다 먹었으면 체크해요 👆</div>`:""}</div></div>`;
  }).join(""):`<div class="empty"><div>🫙</div>${filter==="실온"?"실온 보관 음식이 없어요":filter+"실이 비어 있어요"}</div>`;

  const expired=items.filter(i=>hasDate(i)&&daysLeft(i.date)<0);
  const soon=items.filter(i=>{if(!hasDate(i))return false;const d=daysLeft(i.date);return d>=0&&d<=warnDays;});
  $("sAll").textContent=items.length;$("sSoon").textContent=soon.length;$("sBad").textContent=expired.length;
  const a=$("alert");
  const few=l=>l.slice(0,2).map(i=>esc(i.name)).join(", ")+(l.length>2?` 외 ${l.length-2}개`:"");
  if(soon.length){a.className="alert warn";a.innerHTML=`⏰ <b>${few(soon)}</b> 빨리 드세요`;}
  else if(expired.length){a.className="alert warn";a.innerHTML=`⚠️ <b>${few(expired)}</b> 기한 지났어요`;}
  else a.className="alert";
}

// 자주 넣는 음식 기록 (이 휴대폰에만 저장)
function loadHist(){try{return JSON.parse(localStorage.getItem("fridge-hist")||"{}")||{};}catch(e){return {};}}
function saveHist(hh){try{localStorage.setItem("fridge-hist",JSON.stringify(hh));}catch(e){}}
function histOf(hh,it,count){
  const o=hh[it.name]||{n:0,t:0};o.n+=count;o.t=Math.max(o.t,Date.now());o.p=it.place;o.k=it.kind||"유통";
  o.d=hasDate(it)&&it.added?Math.max(0,Math.round((new Date(it.date)-new Date(it.added))/864e5)):null;
  hh[it.name]=o;
}
function remember(it){
  const hh=loadHist();histOf(hh,it,1);
  const ks=Object.keys(hh);if(ks.length>60)ks.sort((a,b)=>(hh[a].n-hh[b].n)||(hh[a].t-hh[b].t)).slice(0,ks.length-60).forEach(k=>delete hh[k]);
  saveHist(hh);
}
function seedHist(){if(Object.keys(loadHist()).length||!items.length)return;const hh={};items.forEach(i=>histOf(hh,i,1));saveHist(hh);}
function renderFreq(){
  const hh=loadHist(),top=Object.entries(hh).sort((a,b)=>(b[1].n-a[1].n)||(b[1].t-a[1].t)).slice(0,12);
  $("freqWrap").style.display=top.length?"":"none";
  $("freq").innerHTML=top.map(([k])=>`<button type="button" data-name="${esc(k)}"><span class="fi">${icoHTML(iconFor(k))}</span>${esc(k)}</button>`).join("");
}
$("freq").onclick=e=>{
  const b=e.target.closest("[data-name]");if(!b)return;
  const k=b.dataset.name,o=loadHist()[k];if(!o)return;
  $("name").value=k;$("name").dispatchEvent(new Event("input"));
  place=o.p||place;document.querySelectorAll("#places button").forEach(x=>x.classList.toggle("on",x.dataset.p===place));
  if(o.k){kind=o.k;markKinds("#kinds",kind);}
  if(o.d===null||o.d===undefined){setNoDate(true);}else{setNoDate(false);const d=new Date();d.setDate(d.getDate()+o.d);$("date").value=ymd(d);updPh();}
};
async function addItem(it){
  remember(it);
  items.push(it);setTab(it.place);toast(icoText(iconFor(it.name))+" "+it.name+(qtyOf(it)>1?" "+qtyOf(it)+"개":"")+" 넣었어요");
  saveLocal();
}
function eatOne(id){
  const it=items.find(i=>i.id===id);if(!it)return;
  const q=qtyOf(it);if(q<=1){delItem(id);return;}
  it.qty=q-1;render();saveLocal();
  toast(`😋 ${it.name} 1개 먹었어요 (${q-1}개 남음)`,()=>{it.qty=q;render();saveLocal();});
}
async function delItem(id){
  const it=items.find(i=>i.id===id);
  items=items.filter(i=>i.id!==id);render();
  if(it)toast("😋 "+it.name+" 다 먹었어요",()=>{items.push(it);render();saveLocal();});
  saveLocal();
}
async function saveDays(){
  saveLocal();
}

let lastIco="🍽️";
$("name").addEventListener("input",()=>{
  const ico=iconFor($("name").value),p=$("preview");
  if(ico!==lastIco){p.innerHTML=icoHTML(ico);p.classList.add("pop");setTimeout(()=>p.classList.remove("pop"),250);lastIco=ico;}
});
$("form").addEventListener("submit",e=>{
  e.preventDefault();
  const name=$("name").value.trim(),date=noDate?"":$("date").value;
  if(!name)return;
  if(!noDate&&!date){showDateErr(true);$("date").focus({preventScroll:true});$("date").scrollIntoView({block:"center",behavior:"smooth"});return;}
  addItem({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,date,kind,place,qty:addQty,icon:iconFor(name),added:ymd(new Date())});addQty=1;$("qty").textContent=1;
  setNoDate(false);defaultDate();showDateErr(false);$("name").value="";$("preview").textContent="🍽️";lastIco="🍽️";$("addModal").classList.remove("show");
});
document.querySelectorAll("#kinds button").forEach(b=>b.onclick=()=>{kind=b.dataset.k;markKinds("#kinds",kind);try{localStorage.setItem("fridge-kind",kind);}catch(e){}});
document.querySelectorAll("#places button").forEach(b=>b.onclick=()=>{place=b.dataset.p;document.querySelectorAll("#places button").forEach(x=>x.classList.toggle("on",x===b));});
let noDate=false;
function showDateErr(on){$("dateErr").classList.toggle("show",on);$("date").classList.toggle("bad",on);}
$("date").addEventListener("input",()=>{if($("date").value)showDateErr(false);updPh();});
$("date").addEventListener("change",updPh);
function updPh(){const e=noDate||!$("date").value;$("dwrap").classList.toggle("noval",e);$("dph").textContent=noDate?"기한 없이 넣어요":"📅 여기를 눌러 날짜를 골라요";}
function setNoDate(on){noDate=on;if(on)showDateErr(false);$("noDate").classList.toggle("on",on);$("date").disabled=on;updPh();}
document.querySelectorAll(".quick button").forEach(b=>b.onclick=()=>{if(b.dataset.d==="none"){setNoDate(!noDate);return;}setNoDate(false);const d=new Date();d.setDate(d.getDate()+ +b.dataset.d);$("date").value=ymd(d);showDateErr(false);updPh();});
function setTab(f){filter=f;selMode=false;picked=new Set();document.querySelectorAll("#ptabs button").forEach(x=>x.classList.toggle("on",x.dataset.f===f));render();}
document.querySelectorAll("#ptabs button").forEach(b=>b.onclick=()=>setTab(b.dataset.f));

function ddayText(d){return d<0?(-d)+"일 지남":d===0?"오늘까지":"D-"+d;}
let openId=null;
function openFood(id){
  const i=items.find(x=>x.id===id);if(!i)return;openId=id;
  const d=hasDate(i)?daysLeft(i.date):NaN;
  $("mIco").innerHTML=icoHTML(iconFor(i.name));$("mName").textContent=i.name;
  $("mInfo").textContent=hasDate(i)?i.place+" · "+kindOf(i)+" "+i.date.replace(/-/g,".")+"까지 ("+ddayText(d)+")":i.place+" · 기한 없음 · "+sinceText(i);
  $("mNameIn").value=i.name;$("mDate").value=hasDate(i)?i.date:ymd(new Date(Date.now()+7*864e5));setMNoDate(!hasDate(i));mKind=i.kind==="소비"?"소비":"유통";markKinds("#mKinds",mKind);mPlace=i.place;markPlace();mQty=qtyOf(i);$("mQty").textContent=mQty;$("mEat").textContent=mQty>1?"전부 다 먹음 ✓":"다 먹음 ✓";
  $("modal").classList.add("show");
}
let mPlace="냉장",mNoDate=false,mKind="유통";
document.querySelectorAll("#mKinds button").forEach(b=>b.onclick=()=>{mKind=b.dataset.k;markKinds("#mKinds",mKind);});
function setMNoDate(on){mNoDate=on;$("mNoDate").classList.toggle("on",on);$("mDate").disabled=on;}
$("mNoDate").onclick=()=>setMNoDate(!mNoDate);
const clampQ=n=>Math.max(1,Math.min(99,n));
$("qStep").onclick=e=>{const b=e.target.closest("[data-q]");if(!b)return;addQty=clampQ(addQty+ +b.dataset.q);$("qty").textContent=addQty;};
$("mStep").onclick=e=>{const b=e.target.closest("[data-q]");if(!b)return;mQty=clampQ(mQty+ +b.dataset.q);$("mQty").textContent=mQty;};

// 온도 설정
const TEMP={fz:{min:-24,max:-14,label:"❄️ 냉동실 온도",good:[-20,-18]},fr:{min:0,max:7,label:"🧊 냉장실 온도",good:[1,4]}};
let tKey="fz",tTmp=0;
function tUpdate(){
  const c=TEMP[tKey];$("tVal").textContent=tTmp+"°";$("tVal").className="val"+(tKey==="fr"?" cold":"");
  const n=$("tNote");
  if(tKey==="fz"){n.className="tnote"+(tTmp>-15?" bad":"");n.textContent=tTmp>-15?"⚠️ 너무 높아요. 냉동식품은 -18° 이하가 좋아요.":"보통 -18° 정도가 알맞아요. (설정 범위 -24° ~ -14°)";}
  else{n.className="tnote"+(tTmp>5?" bad":"");n.textContent=tTmp>5?"⚠️ 너무 높아요. 음식이 빨리 상할 수 있어요.":tTmp===0?"0°는 채소가 얼 수 있어요. 보통 3° 정도가 알맞아요.":"보통 3° 정도가 알맞아요. (설정 범위 0° ~ 7°)";}
  $("tMinus").disabled=tTmp<=c.min;$("tPlus").disabled=tTmp>=c.max;
  $("tMinus").style.opacity=tTmp<=c.min?.35:1;$("tPlus").style.opacity=tTmp>=c.max?.35:1;
}
function openTemp(k){tKey=k;tTmp=temps[k];$("tTitle").textContent=TEMP[k].label;tUpdate();$("tModal").classList.add("show");}
$("tMinus").onclick=()=>{if(tTmp>TEMP[tKey].min){tTmp--;tUpdate();}};
$("tPlus").onclick=()=>{if(tTmp<TEMP[tKey].max){tTmp++;tUpdate();}};
$("tOk").onclick=()=>{temps[tKey]=tTmp;saveLocal();render();$("tModal").classList.remove("show");toast((tKey==="fz"?"냉동실 ":"냉장실 ")+tTmp+"°로 설정했어요");};
$("tClose").onclick=()=>$("tModal").classList.remove("show");
$("tModal").onclick=e=>{if(e.target.id==="tModal")$("tModal").classList.remove("show");};
function closeModal(){$("modal").classList.remove("show");openId=null;}
$("mClose").onclick=closeModal;
$("modal").onclick=e=>{if(e.target.id==="modal")closeModal();};
$("mEat").onclick=()=>{const id=openId;closeModal();if(id)delItem(id);};
$("list").addEventListener("click",e=>{const tp=e.target.closest(".tip");if(tp||e.target.closest(".del")){try{localStorage.setItem("fridge-tip","1");}catch(x){}document.querySelectorAll(".tip").forEach(t=>t.remove());if(tp)return;}const d=e.target.closest(".del");if(d){if(d.classList.contains("done"))return;d.classList.add("done");const it=items.find(i=>i.id===d.dataset.id);
    if(it&&qtyOf(it)>1){setTimeout(()=>eatOne(d.dataset.id),300);return;}
    setTimeout(()=>d.closest(".item").classList.add("out"),250);setTimeout(()=>delItem(d.dataset.id),550);return;}
  const pk=e.target.closest("[data-pick]");if(pk){const id=pk.dataset.pick;picked.has(id)?picked.delete(id):picked.add(id);render();return;}const it=e.target.closest("[data-open]");if(it)openFood(it.dataset.open);});
function setSel(on){selMode=on;picked=new Set();render();}
$("selCancel").onclick=()=>setSel(false);
$("selDel").onclick=()=>{
  const gone=items.filter(i=>picked.has(i.id));if(!gone.length)return;
  items=items.filter(i=>!picked.has(i.id));selMode=false;picked=new Set();render();saveLocal();
  toast(`🗑️ ${gone.length}개 지웠어요`,()=>{items.push(...gone);render();saveLocal();});
};
$("phead").addEventListener("click",e=>{
  if(e.target.id==="selOn"){setSel(true);return;}
  if(e.target.id==="selAll"){const l=items.filter(i=>i.place===filter);picked=picked.size===l.length?new Set():new Set(l.map(i=>i.id));render();return;}const t=e.target.closest("[data-temp]");if(t)openTemp(t.dataset.temp);});

// ===== 앱을 닫아도 오는 알림 =====
const PUSH_OK="serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window;
const pushIsOn=()=>{try{return localStorage.getItem("fridge-push")==="1";}catch(e){return false;}};
function b64uToBytes(s){s=s.replace(/-/g,"+").replace(/_/g,"/");const r=atob(s+"===".slice((s.length+3)%4));return Uint8Array.from(r,c=>c.charCodeAt(0));}
function pushBody(sub){return JSON.stringify({sub:{endpoint:sub.endpoint},items:items.filter(hasDate).map(i=>({name:i.name,date:i.date})),warnDays,tz:new Date().getTimezoneOffset()});}
async function getSub(){const reg=await navigator.serviceWorker.ready;return reg.pushManager.getSubscription();}
async function api(path,body){const r=await fetch("api/"+path,{method:"POST",headers:{"content-type":"application/json"},body});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||("서버 오류 "+r.status));return j;}
function renderPush(){
  const on=pushIsOn();$("bell").classList.toggle("off",!on);$("bell").textContent=on?"🔔 알림 켜짐":"🔔 알림 켜기";
  $("pushOn").style.display=on?"none":"";$("pushOnBtns").style.display=on?"flex":"none";
  let note="매일 아침 9시에 곧 끝나는 음식을 알려드려요.";
  if(!PUSH_OK)note="이 브라우저에서는 알림을 받을 수 없어요. (아이폰은 공유 버튼 → '홈 화면에 추가' 후 거기서 열어 주세요)";
  else if(Notification.permission==="denied")note="알림이 차단돼 있어요. 휴대폰 설정에서 이 앱(또는 크롬)의 알림을 허용해 주세요.";
  else if(on)note="✅ 켜져 있어요. 매일 아침 9시에 알려드려요.";
  $("pushNote").textContent=note;
}
async function enablePush(){
  if(!PUSH_OK){toast("이 브라우저는 알림을 지원하지 않아요");return;}
  const btn=$("pushOn");btn.disabled=true;
  try{
    const perm=await Notification.requestPermission();
    if(perm!=="granted"){toast("알림 권한을 허용해 주세요");return;}
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub){const r=await fetch("api/vapid");const {key}=await r.json();sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToBytes(key)});}
    await api("subscribe",pushBody(sub));
    localStorage.setItem("fridge-push","1");toast("🔔 알림을 켰어요");
  }catch(e){toast("알림을 켜지 못했어요: "+e.message);}
  finally{btn.disabled=false;renderPush();}
}
async function disablePush(){
  try{const sub=await getSub();if(sub){await api("unsubscribe",JSON.stringify({endpoint:sub.endpoint})).catch(()=>{});await sub.unsubscribe();}}catch(e){}
  try{localStorage.removeItem("fridge-push");}catch(e){}
  toast("알림을 껐어요");renderPush();
}
let syncT;
function syncPush(){
  if(!PUSH_OK||!pushIsOn())return;
  clearTimeout(syncT);
  syncT=setTimeout(async()=>{try{const sub=await getSub();if(sub)await api("subscribe",pushBody(sub));}catch(e){}},800);
}
$("pushOn").onclick=enablePush;$("pushOff").onclick=disablePush;
renderPush();syncPush();
</script>
