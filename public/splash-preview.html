<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시작 화면 미리보기</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=block" rel="stylesheet">
<style>
body{margin:0;background:#dfe6ec;font-family:"Jua",sans-serif;display:flex;gap:16px;padding:16px;flex-wrap:wrap}
.box{width:280px}
.n{font-size:28px;color:#2b7fd4;text-align:center;margin-bottom:8px}
.ph{height:540px;border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.blue{background:linear-gradient(140deg,#7fd3f7 0%,#5aa9f5 55%,#7b8cf5 100%);color:#fff}
.white{background:#fff;color:#22323f}
.l{display:flex;align-items:center}
.v{flex-direction:column;gap:12px}.v .i{font-size:60px;line-height:1}.v .t{font-size:32px}
.h{gap:8px}.h .i{font-size:34px;line-height:1}.h .t{font-size:31px}
.t{letter-spacing:-.5px}
</style></head><body>
<div class="box"><div class="n">1</div><div class="ph blue"><div class="l v"><div class="i">🧊</div><div class="t">우리집 냉장고</div></div></div></div>
<div class="box"><div class="n">2</div><div class="ph blue"><div class="l h"><div class="i">🧊</div><div class="t">우리집 냉장고</div></div></div></div>
<div class="box"><div class="n">3</div><div class="ph white"><div class="l v"><div class="i">🧊</div><div class="t">우리집 냉장고</div></div></div></div>
<div class="box"><div class="n">4</div><div class="ph white"><div class="l h"><div class="i">🧊</div><div class="t">우리집 냉장고</div></div></div></div>
</body></html>
